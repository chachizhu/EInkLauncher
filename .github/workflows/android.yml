name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  # Serialize all tagged releases so two different versions cannot both pass the
  # stable-version check against the same repository state.
  group: android-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      release_apk_sha256: ${{ steps.sign_release.outputs.apk_sha256 }}
      release_version_code: ${{ steps.release_metadata.outputs.version_code }}
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tagged release target
        id: release_metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if existing_release="$(
            gh release view "$GITHUB_REF_NAME" --json isDraft,url 2>/dev/null
          )"; then
            printf 'Release %s already exists; refusing to rebuild or reuse signing material.\n' \
              "$GITHUB_REF_NAME" >&2
            printf '%s\n' "$existing_release" >&2
            exit 1
          fi

          version_pattern='^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          if [[ ! "$GITHUB_REF_NAME" =~ $version_pattern ]]; then
            printf 'Release tag must use canonical vX.Y.Z form with major <= 2146 and minor/patch <= 999: %s\n' \
              "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          release_major=$((10#${BASH_REMATCH[1]}))
          release_minor=$((10#${BASH_REMATCH[2]}))
          release_patch=$((10#${BASH_REMATCH[3]}))
          if (( release_major > 2146 )); then
            printf 'Release major version must not exceed 2146: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if (( release_major == 0 && release_minor == 0 && release_patch == 0 )); then
            printf 'v0.0.0 is not a publishable release version.\n' >&2
            exit 1
          fi
          release_version_code=$((
            release_major * 1000000 + release_minor * 1000 + release_patch
          ))

          stable_release_tags="$(
            gh api --paginate "repos/${GH_REPO:?}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )"
          while IFS= read -r stable_tag; do
            [[ -z "$stable_tag" ]] && continue
            if [[ ! "$stable_tag" =~ $version_pattern ]]; then
              printf 'Existing stable Release has an unsupported tag; refusing an ambiguous version comparison: %s\n' \
                "$stable_tag" >&2
              exit 1
            fi
            stable_major=$((10#${BASH_REMATCH[1]}))
            stable_minor=$((10#${BASH_REMATCH[2]}))
            stable_patch=$((10#${BASH_REMATCH[3]}))
            if ((
              stable_major > 2146 ||
              (stable_major == 0 && stable_minor == 0 && stable_patch == 0)
            )); then
              printf 'Existing stable Release falls outside the supported version range: %s\n' \
                "$stable_tag" >&2
              exit 1
            fi
            stable_version_code=$((
              stable_major * 1000000 + stable_minor * 1000 + stable_patch
            ))
            if (( release_version_code <= stable_version_code )); then
              printf 'New release must be semantically newer than every existing stable Release.\n' >&2
              printf '  candidate: %s (versionCode %d)\n' \
                "$GITHUB_REF_NAME" "$release_version_code" >&2
              printf '  blocking:  %s (versionCode %d)\n' \
                "$stable_tag" "$stable_version_code" >&2
              exit 1
            fi
          done <<< "$stable_release_tags"

          printf 'version_code=%d\n' "$release_version_code" >> "$GITHUB_OUTPUT"
          printf 'Release %s maps deterministically to versionCode %d.\n' \
            "$GITHUB_REF_NAME" "$release_version_code"

          resolve_remote_tag_commit() {
            local object_line object_type object_sha depth=0
            object_line="$(
              gh api "repos/${GH_REPO:?}/git/ref/tags/${GITHUB_REF_NAME:?}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )"
            IFS=$'\t' read -r object_type object_sha <<< "$object_line"
            while [[ "$object_type" == "tag" ]]; do
              depth=$((depth + 1))
              if (( depth > 5 )); then
                printf 'Release tag contains an unexpectedly deep tag chain.\n' >&2
                return 1
              fi
              object_line="$(
                gh api "repos/${GH_REPO:?}/git/tags/${object_sha:?}" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )"
              IFS=$'\t' read -r object_type object_sha <<< "$object_line"
            done
            if [[ "$object_type" != "commit" || ! "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf 'Release tag does not resolve to a Git commit.\n' >&2
              return 1
            fi
            printf '%s' "$object_sha" | tr '[:upper:]' '[:lower:]'
          }

          remote_tag_commit="$(resolve_remote_tag_commit)"
          expected_commit="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ "$remote_tag_commit" != "$expected_commit" ]]; then
            printf 'Remote tag no longer points to the commit that triggered this workflow.\n' >&2
            printf '  expected: %s\n' "$expected_commit" >&2
            printf '  remote:   %s\n' "$remote_tag_commit" >&2
            exit 1
          fi
          printf 'Release tag %s resolves to triggering commit %s.\n' \
            "$GITHUB_REF_NAME" "$expected_commit"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Install Android SDK components
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and assemble APK
        env:
          RELEASE_VERSION_CODE: ${{ steps.release_metadata.outputs.version_code }}
        shell: bash
        run: |
          tasks=(lintDebug testDebugUnitTest assembleDebug)
          gradle_args=(--no-daemon)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]; then
              printf 'Release validation did not provide a valid versionCode.\n' >&2
              exit 1
            fi
            tasks+=(assembleRelease)
            gradle_args+=(
              "-PversionName=${GITHUB_REF_NAME#v}"
              "-PversionCode=${RELEASE_VERSION_CODE}"
            )
          fi
          ./gradlew "${gradle_args[@]}" "${tasks[@]}"

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eink-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Sign tagged release APK
        id: sign_release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # This is the public release identity documented in README.md. Changing it is a
          # release-key migration, not a routine CI edit.
          EXPECTED_SIGNER_SHA256: "52:13:03:92:02:AE:7C:F9:7B:52:0E:A8:9E:02:18:2A:89:EC:8B:74:AF:E1:F9:14:FA:95:EE:17:F8:18:9E:A7"
        shell: bash
        run: |
          set -euo pipefail

          required_secrets=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if (( ${#missing_secrets[@]} > 0 )); then
            printf 'Tag release aborted. Missing GitHub Actions secrets:\n' >&2
            printf '  - %s\n' "${missing_secrets[@]}" >&2
            exit 1
          fi

          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ ! -f "$unsigned_apk" ]]; then
            printf 'Unsigned release APK was not produced at %s\n' "$unsigned_apk" >&2
            exit 1
          fi

          build_tools_dir="${ANDROID_HOME:?}/build-tools/35.0.0"
          apksigner_path="$build_tools_dir/apksigner"
          zipalign_path="$build_tools_dir/zipalign"
          if [[ ! -x "$apksigner_path" ]]; then
            printf 'Android SDK Build Tools 35.0.0 apksigner was not found.\n' >&2
            exit 1
          fi
          if [[ ! -x "$zipalign_path" ]]; then
            printf 'Android SDK Build Tools 35.0.0 zipalign was not found.\n' >&2
            exit 1
          fi

          signing_dir="${RUNNER_TEMP:?}/eink-launcher-signing"
          keystore_path="$signing_dir/release.keystore"
          cleanup_signing_material() {
            rm -f -- "$keystore_path"
          }
          trap cleanup_signing_material EXIT

          mkdir -p "$signing_dir" signed
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            printf 'Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64.\n' >&2
            exit 1
          fi

          release_name="${GITHUB_REF_NAME//\//-}"
          signed_apk="signed/EInkLauncher-${release_name}.apk"
          aligned_apk="$signing_dir/aligned-release.apk"
          "$zipalign_path" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner_path" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$zipalign_path" -c -v 4 "$signed_apk"

          verify_output="$("$apksigner_path" verify --verbose --print-certs "$signed_apk")"
          printf '%s\n' "$verify_output"

          mapfile -t signer_counts < <(
            printf '%s\n' "$verify_output" |
              sed -n -E 's/^Number of signers: ([0-9]+)$/\1/p'
          )
          if (( ${#signer_counts[@]} != 1 )) || [[ "${signer_counts[0]}" != "1" ]]; then
            printf 'Expected apksigner to report exactly one APK signer.\n' >&2
            exit 1
          fi

          mapfile -t signer_digests < <(
            printf '%s\n' "$verify_output" |
              sed -n -E \
                's/^([^ ]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: ([0-9A-Fa-f]{64})$/\3/p'
          )
          if (( ${#signer_digests[@]} != 1 )); then
            printf 'Expected exactly one APK signer SHA-256 digest, found %d.\n' \
              "${#signer_digests[@]}" >&2
            exit 1
          fi

          mapfile -t readme_digests < <(
            grep -Eo '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}' README.md
          )
          if (( ${#readme_digests[@]} != 1 )); then
            printf 'README.md must contain exactly one release certificate SHA-256 fingerprint.\n' >&2
            exit 1
          fi

          normalize_fingerprint() {
            printf '%s' "$1" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]'
          }
          expected_signer="$(normalize_fingerprint "$EXPECTED_SIGNER_SHA256")"
          documented_signer="$(normalize_fingerprint "${readme_digests[0]}")"
          actual_signer="$(normalize_fingerprint "${signer_digests[0]}")"

          if [[ "$documented_signer" != "$expected_signer" ]]; then
            printf 'README release certificate fingerprint does not match the CI trust anchor.\n' >&2
            printf '  expected: %s\n' "$EXPECTED_SIGNER_SHA256" >&2
            printf '  README:   %s\n' "${readme_digests[0]}" >&2
            exit 1
          fi
          if [[ "$actual_signer" != "$expected_signer" ]]; then
            printf 'Signed APK certificate does not match the fixed release certificate.\n' >&2
            printf '  expected: %s\n' "$EXPECTED_SIGNER_SHA256" >&2
            printf '  actual:   %s\n' "${signer_digests[0]}" >&2
            exit 1
          fi
          printf 'Release signer SHA-256 matches the fixed project certificate: %s\n' \
            "$EXPECTED_SIGNER_SHA256"

          apk_sha256="$(sha256sum "$signed_apk" | awk '{ print $1 }')"
          if [[ ! "$apk_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Could not calculate the signed APK SHA-256 digest.\n' >&2
            exit 1
          fi
          printf 'apk_sha256=%s\n' "$apk_sha256" >> "$GITHUB_OUTPUT"
          printf 'Signed APK SHA-256: %s\n' "$apk_sha256"

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eink-launcher-release
          path: signed/*.apk
          if-no-files-found: error

  release:
    name: Publish signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eink-launcher-release
          path: dist

      - name: Create checksum
        env:
          EXPECTED_APK_SHA256: ${{ needs.build.outputs.release_apk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          release_name="${GITHUB_REF_NAME//\//-}"
          apk_name="EInkLauncher-${release_name}.apk"
          if [[ ! -f "dist/$apk_name" ]]; then
            printf 'Signed release APK was not downloaded at dist/%s\n' "$apk_name" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Build job did not provide a valid signed APK SHA-256 digest.\n' >&2
            exit 1
          fi
          actual_apk_sha256="$(sha256sum "dist/$apk_name" | awk '{ print $1 }')"
          if [[ "$actual_apk_sha256" != "$EXPECTED_APK_SHA256" ]]; then
            printf 'Downloaded artifact does not match the APK verified by the build job.\n' >&2
            printf '  expected: %s\n' "$EXPECTED_APK_SHA256" >&2
            printf '  actual:   %s\n' "$actual_apk_sha256" >&2
            exit 1
          fi
          printf 'Downloaded APK matches build SHA-256: %s\n' "$actual_apk_sha256"
          cd dist
          sha256sum "$apk_name" > "$apk_name.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION_CODE: ${{ needs.build.outputs.release_version_code }}
        shell: bash
        run: |
          set -euo pipefail

          if existing_release="$(
            gh release view "$GITHUB_REF_NAME" --json isDraft,url 2>/dev/null
          )"; then
            printf 'Release %s already exists; this workflow will not modify it or its assets.\n' \
              "$GITHUB_REF_NAME" >&2
            printf '%s\n' "$existing_release" >&2
            printf 'Create a new, higher patch version instead of replacing existing assets.\n' >&2
            exit 1
          fi

          version_pattern='^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          if [[ ! "$GITHUB_REF_NAME" =~ $version_pattern ]]; then
            printf 'Release tag no longer satisfies the validated semver format: %s\n' \
              "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          release_major=$((10#${BASH_REMATCH[1]}))
          release_minor=$((10#${BASH_REMATCH[2]}))
          release_patch=$((10#${BASH_REMATCH[3]}))
          release_version_code=$((
            release_major * 1000000 + release_minor * 1000 + release_patch
          ))
          if [[ "$release_version_code" != "$RELEASE_VERSION_CODE" ]]; then
            printf 'Release versionCode changed between build and publish jobs.\n' >&2
            printf '  build output: %s\n' "$RELEASE_VERSION_CODE" >&2
            printf '  recomputed:   %s\n' "$release_version_code" >&2
            exit 1
          fi

          stable_release_tags="$(
            gh api --paginate "repos/${GH_REPO:?}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )"
          while IFS= read -r stable_tag; do
            [[ -z "$stable_tag" ]] && continue
            if [[ ! "$stable_tag" =~ $version_pattern ]]; then
              printf 'Existing stable Release has an unsupported tag; refusing an ambiguous version comparison: %s\n' \
                "$stable_tag" >&2
              exit 1
            fi
            stable_major=$((10#${BASH_REMATCH[1]}))
            stable_minor=$((10#${BASH_REMATCH[2]}))
            stable_patch=$((10#${BASH_REMATCH[3]}))
            if ((
              stable_major > 2146 ||
              (stable_major == 0 && stable_minor == 0 && stable_patch == 0)
            )); then
              printf 'Existing stable Release falls outside the supported version range: %s\n' \
                "$stable_tag" >&2
              exit 1
            fi
            stable_version_code=$((
              stable_major * 1000000 + stable_minor * 1000 + stable_patch
            ))
            if (( release_version_code <= stable_version_code )); then
              printf 'Repository stable releases changed after the build; refusing to publish %s after %s.\n' \
                "$GITHUB_REF_NAME" "$stable_tag" >&2
              exit 1
            fi
          done <<< "$stable_release_tags"

          resolve_remote_tag_commit() {
            local object_line object_type object_sha depth=0
            object_line="$(
              gh api "repos/${GH_REPO:?}/git/ref/tags/${GITHUB_REF_NAME:?}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )"
            IFS=$'\t' read -r object_type object_sha <<< "$object_line"
            while [[ "$object_type" == "tag" ]]; do
              depth=$((depth + 1))
              if (( depth > 5 )); then
                printf 'Release tag contains an unexpectedly deep tag chain.\n' >&2
                return 1
              fi
              object_line="$(
                gh api "repos/${GH_REPO:?}/git/tags/${object_sha:?}" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )"
              IFS=$'\t' read -r object_type object_sha <<< "$object_line"
            done
            if [[ "$object_type" != "commit" || ! "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf 'Release tag does not resolve to a Git commit.\n' >&2
              return 1
            fi
            printf '%s' "$object_sha" | tr '[:upper:]' '[:lower:]'
          }

          remote_tag_commit="$(resolve_remote_tag_commit)"
          expected_commit="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ "$remote_tag_commit" != "$expected_commit" ]]; then
            printf 'Remote tag changed after the release build; refusing to publish.\n' >&2
            printf '  expected: %s\n' "$expected_commit" >&2
            printf '  remote:   %s\n' "$remote_tag_commit" >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "E-Ink Launcher $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "此 APK 已使用项目固定的 release 证书签名，可在保留应用数据的情况下覆盖升级。SHA-256 校验文件与 APK 一并提供。已发布的 Release 与资产不会被覆盖；如需修复，请发布更高版本号的新版本。"
